services:
  - type: web
    name: flux-yt-dlp-web
    runtime: python
    plan: free
    buildCommand: apt-get update && apt-get install -y ffmpeg && pip install -r requirements.txt
    startCommand: waitress-serve --host=0.0.0.0 --port=$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FLUX_MAX_JOBS
        value: 1
      - key: FLUX_MAX_OUTPUT_MB
        value: 450
